org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# Jetifier hanya dibutuhkan kalau masih ada dependency com.android.support.*
# (tidak ada di project ini). Selain memperlambat build, JetifyTransform sempat
# kehabisan heap saat memproses jar engine Flutter.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Mesin ini tidak punya default route IPv6, sementara repo.maven.apache.org
# mengiklankan AAAA. Tanpa ini Gradle bisa gagal "No route to host".
systemProp.java.net.preferIPv4Stack=true
