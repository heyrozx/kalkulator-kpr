plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.caraguna.kalkulator.kpr"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.caraguna.kalkulator.kpr"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Flutter sudah mengaktifkan R8 untuk release; aturan tambahan
            // aplikasi ada di proguard-rules.pro (lihat catatan WorkManager di sana).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Pengganti kotlinOptions di dalam blok android (deprecated sejak Kotlin 2.x).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.material:material:1.8.0'
    // Google Play mewajibkan Billing Library >= 8.0.0 mulai 31 Agustus 2026.
    // RevenueCat (purchases_flutter) juga sudah membawa Billing 8.x secara transitif,
    // baris di bawah hanya sebagai batas bawah eksplisit — jangan turunkan versinya.
    implementation 'com.android.billingclient:billing:8.0.0'
    // AdMob (play-services-ads-api) membawa WorkManager 2.7.0 + Room 2.2.5 secara
    // transitif. Aturan keep Room 2.2.5 tidak menjaga constructor WorkDatabase_Impl,
    // sehingga R8 full mode (default AGP 8) membuangnya dan aplikasi crash saat
    // start: "Failed to create an instance of androidx.work.impl.WorkDatabase".
    // WorkManager 2.11 memakai Room 2.7 yang aturan keep-nya sudah benar.
    // Jangan turunkan atau hapus baris ini.
    implementation 'androidx.work:work-runtime:2.11.2'
}
