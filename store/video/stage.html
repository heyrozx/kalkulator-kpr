const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  lin: x => x,

const rp = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };

}, JSON.parse(Q.get('cues') || '{}'));
const DURATION = S.end;

<svg viewBox="0 0 20 16"><rect x="0" y="11" width="3.4" height="5" rx="1"/><rect x="5.4" y="7.5" width="3.4" height="8.5" rx="1"/><rect x="10.8" y="4" width="3.4" height="12" rx="1"/><rect x="16.2" y="0" width="3.4" height="16" rx="1"/></svg>
<svg viewBox="0 0 22 16"><path d="M11 15.5 L0.6 4.6 A15.5 15.5 0 0 1 21.4 4.6 Z"/></svg>
<svg viewBox="0 0 30 16"><rect x="0.8" y="0.8" width="25" height="14.4" rx="3.5" fill="none" stroke="#1d1b20" stroke-width="1.6"/><rect x="3" y="3" width="17.5" height="10" rx="1.8"/><rect x="27" y="5" width="2.6" height="6" rx="1.2"/></svg></span>`;

function makePhone(x, y) {

function layer(scr, img) {

const RC = 2 * Math.PI * 341;
const track = mkC('rgb(184,199,203)'); const arc = mkC('#9C27B0'); arc.setAttribute('stroke-linecap', 'round');

const legB = el('div', 'legv', H_); css(legB, { left: '651px', top: (1481 - .9277 * 45) + 'px' });
const seg = el('div', 'seg', H_);
const segInd = el('div', 'ind', seg);

};
for (const k in FIELDS) {

}

const taps = [];
for (let i = 0; i < 3; i++) { const tp = el('div', 'tap', P.scr); tp.style.opacity = 0; taps.push(tp); }

// --- HP tambahan (fitur lain)
const EXTRA = [
  { img: 'advanced.png', x: 1700, y: 120, rot: -4, label: 'Fix & Floating' },
  { img: 'syariah.png', x: 3050, y: 0, rot: 0, label: 'KPR Syariah' },

// =====================================================================
//  Overlay teks
// =====================================================================
const ov = document.getElementById('overlay');
function typedNode(parent, cls, styles) { const d = el('div', 'ov ' + (cls || ''), parent); css(d, styles || {}); return d; }
// Teks diketik: kembalikan html sesuai waktu. segs: [{s:'teks', c:'kelas'}]
function typer(segs, t0, cps, sfx = 'type', gain = .55) {
  const flat = segs.map(s => typeof s === 'string' ? { s } : s);
  const n = flat.reduce((a, s) => a + s.s.length, 0);
  let k = 0;
  for (const s of flat) for (const ch of s.s) { if (ch !== ' ' && sfx) ev(t0 + k / cps, sfx, gain); k++; }
  return {
    t0, t1: t0 + n / cps, n,
    html(t, caretUntil = Infinity) {
      let shown = Math.floor(clamp((t - t0) * cps, 0, n)); let out = '';
      for (const s of flat) { const part = s.s.slice(0, Math.max(0, shown)); shown -= s.s.length;
        if (part) out += s.c ? `<span class="${s.c}">${part}</span>` : part; }
      const typing = t < t0 + n / cps;
      const caretOn = t >= t0 - .4 && t < caretUntil && (typing || Math.floor(t * 2.2) % 2 === 0);
      return out + (caretOn ? '<span class="tcaret"></span>' : '<span class="tcaret" style="opacity:0"></span>');
    },
  };
}

<g id="ill-house">

 <!-- atap samping -->

</g>
<g id="ill-coin1"><circle cx="60" cy="150" r="34" fill="url(#hcoin)"/><circle cx="60" cy="150" r="25" fill="none" stroke="#FFF3C4" stroke-width="4"/><text x="60" y="161" text-anchor="middle" font-family="R" font-weight="900" font-size="28" fill="#8D5300">Rp</text></g>

const lg = el('div', 'ov', ov);
lg.innerHTML = `<img src="assets/logo.png" style="width:100%;height:100%;border-radius:22%;background:#fff;box-shadow:0 30px 70px rgba(30,0,50,.4)">`;

// ---------- captions per adegan
function caption(text, num, t0) {
  const d = typedNode(ov, '', {});
  const ty = typer([text], t0, 22, 'type', .45);

}

  css(oLogo, V ? { left: (W / 2 - os / 2) + 'px', top: '170px', width: os + 'px', height: os + 'px' } : { left: '150px', top: '170px', width: os + 'px', height: os + 'px' });
  show(oTitle, oOn, 1);
  css(oTitle, V ? { left: 0, width: W + 'px', textAlign: 'center', top: '440px', fontSize: '110px', fontWeight: 900, letterSpacing: '-2px' }
    : { left: '150px', top: '410px', fontSize: '110px', fontWeight: 900, letterSpacing: '-2px' });
  if (oOn) oTitle.innerHTML = `<span class="typed">${oT.html(t, S.outro + 2.0)}</span>`;
  show(oSub, oOn, 1);
  css(oSub, V ? { left: 0, width: W + 'px', textAlign: 'center', top: '590px', fontSize: '44px', fontWeight: 500, color: 'rgba(255,255,255,.92)' }
    : { left: '150px', top: '560px', fontSize: '42px', fontWeight: 500, color: 'rgba(255,255,255,.92)' });
  if (oOn) oSub.innerHTML = `<span class="typed">${oSubT.html(t, S.outro + 2.4)}</span>`;
  const bk = E.back(prog(t, S.outro + 2.0, S.outro + 2.5));
  const pulse = 1 + Math.max(0, Math.sin((t - S.outro - 2.6) * 5)) * .03 * (t > S.outro + 2.6 ? 1 : 0);
  show(oBadge, t >= S.outro + 2.0, 1, `scale(${bk * pulse})`);
  css(oBadge, V ? { left: 0, width: W + 'px', textAlign: 'center', top: '700px' } : { left: '150px', top: '680px' });
}

window.DURATION = DURATION;
window.EVENTS = EVENTS.sort((a, b) => a.t - b.t);
window.VO = VO;
window.render = render;
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
render(Number(Q.get('t') || 0));
</script>
